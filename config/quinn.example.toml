# Quinn v1 — example non-secret configuration.
# Architecture §10.2. Production location: /opt/quinn/config/quinn.toml
# Reload semantics: SIGHUP reloads hot values (poll cadences, similarity_threshold, log_level);
# structural changes (broker_mode, feature flags) require a restart.

[ingestion]
rss_poll_seconds_market = 60
rss_poll_seconds_offhours = 300
reconciler_interval_seconds = 21600
edgar_user_agent = "Quinn-Research/v1 contact@operator.example"

[prefilter]
similarity_threshold = 0.97
minhash_perms = 128
# Toggle Form 4 ingestion. Default true preserves existing behavior. Set
# false to reject every Form 4 with rule_fired="form_4_disabled" — useful
# once we have prose-form data and want to evaluate the cost/benefit of
# Form 4 LLM analysis without a code change. Structural change: requires
# restart, not SIGHUP.
form_4_enabled = true

[analyzer]
# First-pass analyzer model. Variable name retained for backward compat
# with module names (`src/analyzer/sonnet.py`, `composition.sonnet_model_id`);
# actual model is configurable. As of 2026-05 the default is Haiku 4.5
# (~3x cheaper than Sonnet 4.6) — Opus reviewer at conviction-7+ remains
# the quality safety net.
sonnet_model_id = "claude-haiku-4-5-20251001"
opus_model_id = "claude-opus-4-7"
# Lowered from 7 (2026-05-06) to surface more borderline proposals for Opus
# review while paper-trading. Revisit after observing trade rate vs. Opus
# rejection rate.
opus_review_conviction_threshold = 5
sonnet_max_output_tokens = 4096
opus_max_output_tokens = 4096

[execution]
broker_mode = "paper"             # 'paper' | 'live'
# Tightened from 0.20 (2026-05-06): paper-aggressive utilization knob.
# Lower per-position cap as we widen book to ks5_max_concurrent=10.
# Revisit before live.
ks4_pct_cap = 0.15
ks4_absolute_cap_usd = 1000.0
# Raised from 5 (2026-05-06): paper-aggressive utilization knob.
# Wider book = more diversification across daily proposals. Revisit before live.
ks5_max_concurrent = 10
# Lowered from 0.05 (2026-05-06): paper-aggressive utilization knob.
# Frees ~2% equity for deployment; min liquid reserve. Revisit before live.
ks7_cash_reserve_pct = 0.03
# Raised from 0.05 (2026-05-06): paper-aggressive utilization knob.
# cv5-6 per-position size. Targets ~70% baseline deployed at full book.
# Revisit before live.
sizing_mid_pct = 0.07
sizing_high_pct = 0.10
# Trade-time hard price floor in USD (FR-8 / ADR-006 §3). The universe
# screens on previous-close >= $5; this is the re-check at submission.
# Omitted = 5.0 (unchanged behavior). Lower slightly (e.g. 4.50) to stop
# rejecting names that dip cents under $5 intraday after passing the
# universe screen (2026-07-17: ABUS at $4.79, $946M cap, conviction 8).
# price_floor_usd = 5.0
# Conviction at/above which a proposal earns sizing_high_pct (below it,
# sizing_mid_pct). Bounds [6, 10]. Omitted = 9, the original tiering.
# sizing_high_conviction_min = 9
# DISPLACEMENT (default OFF). When a HIGH-conviction proposal is rejected by
# the KS-7 cash-reserve gate, deterministically evict the weakest qualifying
# open position — trail NOT armed, held >= 5 trading days, not entered today,
# unrealized gain < displacement_victim_max_gain_pct — and fund the new entry
# from the sale proceeds (credited at the haircut; the sell always submits
# before the buy). GRADUATED eligibility: conviction >= 9 ignores the gain
# cutoff; armed positions are untouchable at every conviction. Hard cap in
# code: max ONE displacement per trading day (not configurable).
# displacement_enabled = true
# displacement_min_conviction = 8        # bounds [6, 10]
# displacement_proceeds_haircut = 0.90   # fraction of victim market value credited; (0, 1]
# displacement_victim_max_gain_pct = 5.0 # base-tier victim gain cutoff (% vs cost)
# Staged trail tightening (opt-in). As the position's high-water gain vs
# entry (% of entry) crosses each gain_pct milestone, the effective trail
# width becomes min(current width, trail_pct) — the trail only ever
# TIGHTENS on top of the base width (proposal trail_distance_pct or the
# clamped default), never widens. gain_pct must be strictly ascending,
# trail_pct non-increasing. Absent/empty = flat base-width trailing.
# [[execution.trail_stages]]
# gain_pct = 20.0
# trail_pct = 8.0
# [[execution.trail_stages]]
# gain_pct = 35.0
# trail_pct = 5.0
# Breakeven floor (study policy E, default OFF). Once a position's high-water
# gain vs entry crosses this percent, the trailing stop is never allowed to
# sit below the entry price — a confirmed small winner can no longer round-trip
# into a loser. HWM-based; applied as a lower bound AFTER the width/stage math,
# so it never NARROWS the trail band (that would strangle big runners during
# their early 8-12% wiggles — the whole reason a floor beats a tighter stage).
# Derived at runtime, so a change applies to already-open positions on restart.
# Omitted/0.0 = OFF (byte-identical to the pre-feature trail). Bounded [0, 50].
# breakeven_floor_gain_pct = 12.0

# Event-triggered, zone-aware thesis reviews (A/B feature, default OFF).
# When enabled, held positions get an IMMEDIATE Opus thesis review when:
#   - the position's high-water gain crosses a threshold (defaults to the
#     trail_stages gain_pcts plus the +10% arming line; override with
#     gain_thresholds_pct, strictly ascending);
#   - a newly ingested filing matches a held symbol;
#   - the quote moves >= anomaly_move_pct vs prev close intraday;
#   - a new Alpaca news headline mentions a held symbol;
#   - daily_sweep = true adds a DAILY PRE-MARKET SWEEP: once per UTC day, on
#     the first tick at/after sweep_after_utc_hour (11 UTC ~= 7am ET), EVERY
#     held position gets a review — the fresh-buy test every morning. Once
#     per day per position, restart-safe; positions already reviewed today
#     or with a review pending-and-due are skipped.
# Anti-churn: per-position-per-trigger-type cooldown_hours (default 24 ~=
# once per trading day), and no trigger fires while a review is already
# pending/due for that position. Section absent or enabled=false =
# byte-identical behavior to the pure calendar-review system.
# Structural change: requires restart, not SIGHUP.
# [event_reviews]
# enabled = true
# anomaly_move_pct = 7.0
# cooldown_hours = 24.0
# gain_thresholds_pct = [10.0, 20.0, 35.0]
# daily_sweep = false
# sweep_after_utc_hour = 11
# Capacity-pressure sweep: when daily_sweep fires and the portfolio is
# within this many free slots of its KS-5 effective concurrent-position
# cap, every event:daily_sweep review that morning gets a weakness-ranked
# capacity block biasing the reviewer (under the dead-money doctrine)
# toward freeing the weakest NON-EXEMPT slots. Doctrine exemptions (armed
# trail, dated catalyst ahead, <5 trading days) stay binding. Range 0–5;
# 0 (default) = off. Only meaningful with daily_sweep = true.
# capacity_target_slots = 2

[reconciler]
interval_seconds_market = 300
# Hotfix 2026-05-07 — false-positive halt window. When broker/journal
# positions diverge, look back this many minutes in the `orders` table for
# recent bracket-order rows (entry buy, stop sell, take_profit sell) that
# explain the divergence. If recent orders fully account for the diff, the
# reconciler does not halt (it just snapshots broker truth). Genuine
# unexplained divergence still halts. Raise to loosen the safety net,
# lower to tighten it.
# HOTFIX-2026-05-11: widened from 30 min to 7 days (10_080) so a `tif=day`
# entry submitted Friday afternoon and filled at Monday open (~64h later)
# is still explainable. Bounded enough that genuinely stale state from a
# week ago won't slip through silently.
expected_fill_window_minutes = 10080

[killswitch]
ks1_daily_loss_pct = 0.03
ks2_trailing_dd_pct = 0.10
ks3_consecutive_losses = 6

[observability]
log_level = "INFO"
betterstack_endpoint = "https://in.logs.betterstack.com"

[universe]
# D-065 — per-call floor for the yfinance provider. Yahoo throttles
# residential IPs above ~5 req/sec sustained, so 0.2s = 5 req/sec keeps
# the daily refresh below the throttle band. Decrease only if observed
# failure rate is consistently <5% and runtime matters; increase if
# Yahoo tightens the threshold.
yfinance_min_interval_seconds = 0.2
