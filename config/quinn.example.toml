# Quinn v1 — example non-secret configuration.
# Architecture §10.2. Production location: /opt/quinn/config/quinn.toml
# Reload semantics: SIGHUP reloads hot values (poll cadences, similarity_threshold, log_level);
# structural changes (broker_mode, feature flags) require a restart.

[ingestion]
rss_poll_seconds_market = 60
rss_poll_seconds_offhours = 300
reconciler_interval_seconds = 21600
edgar_user_agent = "Quinn-Research/v1 contact@operator.example"

[prefilter]
similarity_threshold = 0.97
minhash_perms = 128
# Toggle Form 4 ingestion. Default true preserves existing behavior. Set
# false to reject every Form 4 with rule_fired="form_4_disabled" — useful
# once we have prose-form data and want to evaluate the cost/benefit of
# Form 4 LLM analysis without a code change. Structural change: requires
# restart, not SIGHUP.
form_4_enabled = true

[analyzer]
# First-pass analyzer model. Variable name retained for backward compat
# with module names (`src/analyzer/sonnet.py`, `composition.sonnet_model_id`);
# actual model is configurable. As of 2026-05 the default is Haiku 4.5
# (~3x cheaper than Sonnet 4.6) — Opus reviewer at conviction-7+ remains
# the quality safety net.
sonnet_model_id = "claude-haiku-4-5-20251001"
opus_model_id = "claude-opus-4-7"
# Lowered from 7 (2026-05-06) to surface more borderline proposals for Opus
# review while paper-trading. Revisit after observing trade rate vs. Opus
# rejection rate.
opus_review_conviction_threshold = 5
sonnet_max_output_tokens = 4096
opus_max_output_tokens = 4096

[execution]
broker_mode = "paper"             # 'paper' | 'live'
# Tightened from 0.20 (2026-05-06): paper-aggressive utilization knob.
# Lower per-position cap as we widen book to ks5_max_concurrent=10.
# Revisit before live.
ks4_pct_cap = 0.15
ks4_absolute_cap_usd = 1000.0
# Raised from 5 (2026-05-06): paper-aggressive utilization knob.
# Wider book = more diversification across daily proposals. Revisit before live.
ks5_max_concurrent = 10
# Lowered from 0.05 (2026-05-06): paper-aggressive utilization knob.
# Frees ~2% equity for deployment; min liquid reserve. Revisit before live.
ks7_cash_reserve_pct = 0.03
# Raised from 0.05 (2026-05-06): paper-aggressive utilization knob.
# cv5-6 per-position size. Targets ~70% baseline deployed at full book.
# Revisit before live.
sizing_mid_pct = 0.07
sizing_high_pct = 0.10

[reconciler]
interval_seconds_market = 300

[killswitch]
ks1_daily_loss_pct = 0.03
ks2_trailing_dd_pct = 0.10
ks3_consecutive_losses = 6

[observability]
log_level = "INFO"
betterstack_endpoint = "https://in.logs.betterstack.com"

[universe]
# D-065 — per-call floor for the yfinance provider. Yahoo throttles
# residential IPs above ~5 req/sec sustained, so 0.2s = 5 req/sec keeps
# the daily refresh below the throttle band. Decrease only if observed
# failure rate is consistently <5% and runtime matters; increase if
# Yahoo tightens the threshold.
yfinance_min_interval_seconds = 0.2
