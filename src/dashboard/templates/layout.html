<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="{{ auto_refresh_seconds }}">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>quinn · {{ page_title }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/static/dashboard.css">
</head>
<body>
  <header class="topbar">
    <span class="brand">
      <span class="dot {% if ks_state is defined and ks_state == 'halted' %}halt{% endif %}"></span>
      quinn
    </span>
    <nav class="nav">
      <a href="/" class="{% if active_route == 'overview' %}active{% endif %}">Overview</a>
      <a href="/positions" class="{% if active_route == 'positions' %}active{% endif %}">Positions</a>
      <a href="/trades" class="{% if active_route == 'trades' %}active{% endif %}">Trades</a>
      <a href="/proposals" class="{% if active_route == 'proposals' %}active{% endif %}">Proposals</a>
      <a href="/llm" class="{% if active_route == 'llm' %}active{% endif %}">LLM</a>
    </nav>
    <span class="refresh-note">live · {{ auto_refresh_seconds }}s</span>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
